name: Build MC SF6 (ThinkNode M9)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  release:
    types: [ published ]   # nowe wydanie z numerem wersji: build i dołączenie plików .bin

env:
  # wersja MeshCore, na ktorej budujemy (ta sama co firmware Wio; zmien, zeby przejsc na nowsza)
  MESHCORE_REF: a366955cb2f67b8e6842d4f00d2b6a554dddd88a
  PIO_ENV: ThinkNode_M9_sf6

permissions:
  contents: write   # publikacja plików .bin w wydaniu „Najnowszy build”

# jeden build naraz: dwa równoległe nadpisywałyby sobie pliki w wydaniu „Najnowszy build”
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz nasz kod
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          path: m9

      - name: Pobierz MeshCore
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          repository: meshcore-dev/MeshCore
          ref: ${{ env.MESHCORE_REF }}
          path: MeshCore

      - name: Wstaw nasz kod do MeshCore
        run: |
          cp -r m9/m9_sf6 MeshCore/examples/
          # reszta companion bez zmian z MeshCore (nasz jest tylko MyMesh z funkcjami dla ekranu)
          for f in main.cpp DataStore.cpp DataStore.h NodePrefs.h AbstractUITask.h; do
            cp MeshCore/examples/companion_radio/$f MeshCore/examples/m9_sf6/companion/$f
          done
          # liczniki diagnostyczne Bluetooth (połączenia, parowania, ramki)
          python3 m9/tools/patch_ble.py MeshCore/src/helpers/esp32/SerialBLEInterface.cpp
          # ekran startowy MeshSpeed zamiast napisu „Loading...”
          python3 m9/tools/patch_main.py MeshCore/examples/m9_sf6/companion/main.cpp
          cat m9/platformio-m9.ini >> MeshCore/variants/thinknode_m9/platformio.ini

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: ~/.platformio
          key: pio-esp32-${{ runner.os }}-${{ env.MESHCORE_REF }}

      - name: Zainstaluj PlatformIO
        run: pip install -U platformio

      - name: Buduj
        working-directory: MeshCore
        run: |
          pio run -e $PIO_ENV
          pio run -e $PIO_ENV -t mergebin
          ls -la .pio/build/$PIO_ENV/*.bin

      - name: Test dekodera mapy i mapa testowa
        run: |
          pip install pillow numpy
          cd m9/mapa
          python3 pakuj_mape.py testowa --wyjscie ../../mapa-testowa/mapa > /dev/null
          g++ -O2 -o /tmp/test_dekoder test/test_dekoder.cpp ../m9_sf6/ui-test/McmMap.cpp
          /tmp/test_dekoder ../../mapa-testowa/mapa/z13_x4510.mcm 4529 2784 /tmp/kafelek.raw
          cd ../../mapa-testowa && zip -q -r ../mapa-testowa.zip mapa

      - name: Zbierz pliki
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}    # klucz prywatny do podpisu aktualizacji (tylko w sekretach repozytorium)
        run: |
          VER=$(grep -oP 'M9_FW_VERSION\s+"\K[^"]+' m9/m9_sf6/Version.h)
          mkdir -p out
          cp MeshCore/.pio/build/$PIO_ENV/firmware-merged.bin out/MC-SF6-ThinkNode-M9-$VER-pelny.bin
          cp MeshCore/.pio/build/$PIO_ENV/firmware.bin out/MC-SF6-ThinkNode-M9-$VER-aktualizacja.bin
          cp mapa-testowa.zip out/mapa-testowa.zip
          # dla aktualizacji przez WiFi z urządzenia: wersja, plik, rozmiar, MD5, SHA-256 i podpis Ed25519
          pip install -q cryptography
          python3 m9/tools/podpisz.py "$VER" out/MC-SF6-ThinkNode-M9-$VER-aktualizacja.bin m9/m9_sf6/ui/OtaKey.h out/wersja.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: MC-SF6-ThinkNode-M9
          path: out/

      # wydanie „Najnowszy build” (tag „latest-build”) jest nadpisywane przy każdym buildzie z gałęzi main
      - name: Opublikuj w wydaniu „Najnowszy build”
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd m9
          VER=$(grep -oP 'M9_FW_VERSION\s+"\K[^"]+' m9_sf6/Version.h)
          NOTES="Automatyczny build z gałęzi main (wersja $VER, commit ${GITHUB_SHA::7}). Plik „pelny” wgraj od adresu 0x0 przy pierwszym wgraniu; plik „aktualizacja” służy do późniejszych aktualizacji. Aktualizacja przez WiFi z urządzenia korzysta z podpisanego pliku wersja.txt."
          if ! gh release view latest-build >/dev/null 2>&1; then
            gh release create latest-build --prerelease --title "Najnowszy build ($VER)" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            git tag -f latest-build "$GITHUB_SHA" && git push -f origin latest-build
            gh release edit latest-build --title "Najnowszy build ($VER)" --notes "$NOTES" --prerelease
            for a in $(gh release view latest-build --json assets -q '.assets[].name'); do gh release delete-asset latest-build "$a" -y; done
          fi
          gh release upload latest-build ../out/* --clobber

      - name: Dołącz pliki do wydania
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd m9
          gh release upload "${{ github.event.release.tag_name }}" ../out/* --clobber

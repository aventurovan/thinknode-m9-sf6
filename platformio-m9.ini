
; ---------------------------------------------------------------
; MC SF6 dla ThinkNode M9 — WERSJA TESTOWA (companion BLE + ekran testu klawiatury)
; (dopisywane przez workflow do variants/thinknode_m9/platformio.ini)
; ---------------------------------------------------------------
[env:ThinkNode_M9_sf6_test]
extends = ThinkNode_M9
build_unflags = -D LORA_SF=8   ; domyślnie preset SF6 (869,618 · BW 62,5 · SF6 · CR 4/5)
build_flags =
  ${ThinkNode_M9.build_flags}
  -I examples/companion_radio
  -I examples/m9_sf6
  -I examples/m9_sf6/ui-test
  -D LORA_SF=6
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${ThinkNode_M9.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/m9_sf6/ui-test/*.cpp>
lib_deps =
  ${ThinkNode_M9.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

; ---------------------------------------------------------------
; MC SF6 dla ThinkNode M9 — WŁAŚCIWE FIRMWARE: companion BLE + kolorowy interfejs po polsku
; (pliki main.cpp, DataStore.*, NodePrefs.h, AbstractUITask.h workflow kopiuje z examples/companion_radio)
; ---------------------------------------------------------------
[env:ThinkNode_M9_sf6]
extends = ThinkNode_M9
build_unflags = -D LORA_SF=8   ; domyślnie preset SF6 (869,618 · BW 62,5 · SF6 · CR 4/5)
build_flags =
  ${ThinkNode_M9.build_flags}
  -I examples/m9_sf6
  -I examples/m9_sf6/companion
  -I examples/m9_sf6/ui
  -I examples/m9_sf6/ui-test
  -D LORA_SF=6
  -D LORA_CR=8
  -D MAX_CONTACTS=500
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${ThinkNode_M9.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/m9_sf6/companion/*.cpp>
  +<../examples/m9_sf6/ui/*.cpp>
  +<../examples/m9_sf6/ui-test/M9Keyboard.cpp>
  +<../examples/m9_sf6/ui-test/M9Lcd.cpp>
lib_deps =
  ${ThinkNode_M9.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
